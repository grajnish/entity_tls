<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Gift Rain</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			canvas {
				display: block;
				position: fixed;
				inset: 0;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<script>
			var canvas = document.getElementById("c");
			var ctx = canvas.getContext("2d");
			var W, H, FLOOR;

			function resize() {
				W = canvas.width = window.innerWidth;
				H = canvas.height = window.innerHeight;
				FLOOR = H;
			}
			window.addEventListener("resize", resize);
			resize();

			var imgCache = {};
			function getImg(url) {
				if (!imgCache[url]) {
					var i = new Image();
					i.crossOrigin = "anonymous";
					i.src = url;
					imgCache[url] = i;
				}
				return imgCache[url];
			}

			var GRAVITY_MAP = { slow: 0.14, normal: 0.26, fast: 0.48 };
			var MAX_VY = 18;
			var particles = [];
			var MAX_P = 80;

			function spawnOne(img, text, cfg) {
				if (particles.length >= MAX_P) return;
				var r = cfg.size / 2;
				var x;
				if (cfg.zone === "center") {
					x = W / 2 + (Math.random() - 0.5) * W * 0.5;
				} else {
					x = r + Math.random() * (W - cfg.size);
				}
				x = Math.max(r, Math.min(W - r, x));
				particles.push({
					x: x,
					y: -r - Math.random() * 80,
					vx: (Math.random() - 0.5) * 1.5,
					vy: 1 + Math.random() * 2,
					r: r,
					img: img,
					text: text,
					cfg: cfg,
					rot: (Math.random() - 0.5) * 0.8,
					rotV: (Math.random() - 0.5) * 0.06,
					driftPhase: Math.random() * Math.PI * 2,
					driftAmp: cfg.drift ? 0.8 + Math.random() * 2.2 : 0,
					settled: false,
					settledAt: 0,
					alpha: 1,
					scale: 1,
					bounceV: 0,
				});
			}

			function settleParticle(p) {
				if (p.settled) return;
				p.settled = true;
				p.settledAt = Date.now();
				p.vy = -Math.abs(p.vy) * 0.22;
				p.vx *= 0.3;
				p.rotV *= 0.45;
				p.bounceV = 0.18;
			}

			function update() {
				for (var i = particles.length - 1; i >= 0; i--) {
					var p = particles[i];

					if (p.settled) {
						if (p.vy < 0) {
							p.vy *= 0.7;
						} else {
							p.vy = 0;
						}
						p.vx *= 0.88;
						p.x += p.vx;
						p.y += p.vy;
						p.rotV *= 0.92;
						p.rot += p.rotV;

						if (p.bounceV > 0.001) {
							p.bounceV *= 0.8;
							p.scale = 1 + Math.sin(p.bounceV * 20) * p.bounceV * 0.6;
						} else {
							p.scale = 1;
							p.bounceV = 0;
						}

						p.x = Math.max(p.r, Math.min(W - p.r, p.x));
						if (p.y + p.r > FLOOR) {
							p.y = FLOOR - p.r;
							p.vy = 0;
						}

						if (!p.cfg.pile) {
							p.alpha -= 0.012;
							if (p.alpha <= 0) {
								particles.splice(i, 1);
							}
						}
						continue;
					}

					p.driftPhase += 0.04;
					if (p.driftAmp > 0) p.vx = Math.sin(p.driftPhase) * p.driftAmp;
					p.vy += GRAVITY_MAP[p.cfg.speed] || 0.26;
					if (p.vy > MAX_VY) p.vy = MAX_VY;
					p.x += p.vx;
					p.y += p.vy;
					p.rot += p.rotV;
					p.x = Math.max(p.r, Math.min(W - p.r, p.x));

					if (p.y + p.r >= FLOOR) {
						p.y = FLOOR - p.r;
						settleParticle(p);
						continue;
					}

					if (p.cfg.pile && p.vy > 0) {
						for (var j = 0; j < particles.length; j++) {
							if (j === i) continue;
							var q = particles[j];
							if (!q.settled) continue;
							var dx = p.x - q.x,
								dy = p.y - q.y;
							var minD = (p.r + q.r) * 0.88;
							if (dx * dx + dy * dy < minD * minD && p.y < q.y + q.r) {
								p.y = q.y - p.r - q.r * 0.82;
								settleParticle(p);
								break;
							}
						}
					}
				}
			}

			function draw() {
				ctx.clearRect(0, 0, W, H);
				for (var i = 0; i < particles.length; i++) {
					var p = particles[i];
					ctx.save();
					ctx.globalAlpha = p.alpha;
					ctx.translate(p.x, p.y);
					ctx.rotate(p.rot);
					if (p.scale !== 1) ctx.scale(p.scale, p.scale);
					if (p.img.complete && p.img.naturalWidth) {
						ctx.drawImage(p.img, -p.r, -p.r, p.r * 2, p.r * 2);
					} else {
						// emoji / text fallback when image URL fails to load
						ctx.font = p.r * 1.6 + "px serif";
						ctx.textAlign = "center";
						ctx.textBaseline = "middle";
						ctx.fillText(p.text, 0, 0);
					}
					ctx.restore();
				}
			}

			(function loop() {
				update();
				draw();
				requestAnimationFrame(loop);
			})();

			var WS_URL = "ws://127.0.0.1:8766";
			var ws,
				retry = 0;

			function handleMessage(data) {
				if (data.type !== "gift_rain") return;
				var img = getImg(data.image);
				var count = Math.max(1, data.count || 1);
				MAX_P = data.max_drops || 80;
				var cfg = {
					size: data.size || 56,
					speed: data.speed || "normal",
					pile: data.pile !== false,
					drift: data.drift !== false,
					zone: data.spawn_zone || "full",
				};
				var perDelay = Math.max(60, Math.min(300, 1800 / count));
				for (var i = 0; i < count; i++) {
					(function (idx) {
						setTimeout(function () {
							if (particles.length < MAX_P) spawnOne(img, data.image, cfg);
						}, idx * perDelay);
					})(i);
				}
			}

			function connect() {
				try {
					ws = new WebSocket(WS_URL);
				} catch (e) {
					scheduleReconnect();
					return;
				}
				ws.onopen = function () {
					retry = 0;
					particles.length = 0;
					ws.send(JSON.stringify({ type: "identify", overlay: "gift_rain" }));
				};
				ws.onmessage = function (e) {
					try {
						handleMessage(JSON.parse(e.data));
					} catch (_) {}
				};
				ws.onclose = ws.onerror = scheduleReconnect;
			}
			function scheduleReconnect() {
				setTimeout(connect, Math.min(1000 * Math.pow(2, retry++), 10000));
			}
			connect();
		</script>
	</body>
</html>
