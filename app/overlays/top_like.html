<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Righteous&display=swap"
			rel="stylesheet"
		/>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
				font-family: "Righteous", sans-serif;
				font-weight: bolder;
				font-style: normal;
				-webkit-font-smoothing: antialiased;
			}

			#stage {
				position: absolute;
				inset: 0;
				padding: 8px 10px;
				display: flex;
				flex-direction: column;
				--username-color: #fff;
				margin-top: 10px;
			}

			#rows {
				display: flex;
				flex-direction: column;
				gap: 25px;
			}

			.lb-row {
				position: relative;
				flex: 0 0 auto;
				display: flex;
				flex-direction: row-reverse;
				align-items: center;
				padding: 0 10px;
				border-radius: 25px;
				white-space: nowrap;
				color: #fff;
				background: transparent;
			}

			.placeholder {
				opacity: 0.35;
			}

			.lb-rank {
				flex: 0 0 52px;
				font-size: clamp(18px, 4.5vh, 38px);
				font-weight: bold;
				text-align: center;
				color: rgba(255, 160, 180, 0.9);
			}

			.avatar-wrap {
				position: relative;
				flex: 0 0 auto;
				margin-right: 12px;
				margin-left: 8px;
			}

			.lb-avatar {
				width: clamp(32px, 8vh, 62px);
				height: clamp(32px, 8vh, 62px);
				border-radius: 50%;
				object-fit: cover;
				display: block;
			}

			.lb-init {
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: clamp(12px, 3.2vh, 26px);
				font-weight: 900;
				color: #fff;
				background: rgba(255, 60, 100, 0.3);
			}

			.r1 .lb-avatar {
				border: 3px solid rgb(255, 100, 150);
			}
			.r2 .lb-avatar {
				border: 3px solid rgb(192, 192, 192);
			}
			.r3 .lb-avatar {
				border: 3px solid rgb(205, 127, 50);
			}

			/* crown floats above the rank-1 avatar */
			.lb-crown {
				position: absolute;
				height: 30px;
				top: -19px;
				left: 50%;
				transform: translateX(-50%);
				pointer-events: none;
			}

			.lb-name {
				font-size: clamp(20px, 7vh, 56px);
				font-weight: bold;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--username-color);
			}

			.lb-coins {
				display: flex;
				align-items: center;
				gap: 5px;
				font-size: clamp(16px, 6vh, 48px);
				font-weight: bold;
				color: #fa2222;
			}

			.lb-info {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				justify-content: center;
				padding: 0 5px;
				gap: 1px;
			}
		</style>
	</head>

	<body>
		<div id="stage">
			<div id="rows"></div>
		</div>

		<script>
			(function () {
				"use strict";

				var WS_URL = "ws://127.0.0.1:8766";
				var TOP_N = 5;

				var stageEl = document.getElementById("stage");
				var rowsEl = document.getElementById("rows");

				var MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };
				var prev = {};
				var ws = null;
				var retry = 0;

				var CROWN_PATH =
					"m 64.000012,31.484944 28.902346,36.127871 28.902242,-36.127871 -7.22553,65.030147 -101.158086,0 L 6.1954237,31.484944 35.0977,67.612815 64.000012,31.484944 z";

				var HEART_SVG =
					'<svg width="0.9em" height="0.9em" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;">' +
					'<path d="M24 43L22.5 41.6C10.5 30.8 2 23.5 2 14.4C2 7 7.9 1 15.3 1C19.4 1 23.3 3 24 5.4C24.7 3 28.6 1 32.7 1C40.1 1 46 7 46 14.4C46 23.5 37.5 30.8 25.5 41.6L24 43Z" fill="currentColor"/>' +
					"</svg>";

				function fmtLikes(n) {
					return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
				}

				function initialsEl(name) {
					var d = document.createElement("div");
					d.className = "lb-avatar lb-init";
					d.textContent = (name || "?").charAt(0).toUpperCase();
					return d;
				}

				function crownSvg() {
					var ns = "http://www.w3.org/2000/svg";
					var svg = document.createElementNS(ns, "svg");
					svg.setAttribute("viewBox", "0 0 128 96.5");
					svg.setAttribute("class", "lb-crown");
					var g = document.createElementNS(ns, "g");
					var path = document.createElementNS(ns, "path");
					path.setAttribute("d", CROWN_PATH);
					path.setAttribute(
						"style",
						"fill:#ffcd00;stroke:#000;stroke-width:4.3;fill-rule:evenodd;",
					);
					g.appendChild(path);
					svg.appendChild(g);
					return svg;
				}

				function buildRow(rank, item, isPlaceholder) {
					var row = document.createElement("div");
					row.className =
						"lb-row r" + rank + (isPlaceholder ? " placeholder" : "");

					var name = (item && item.name) || "———";
					var likes = Number(item && item.likes) || 0;

					var rankEl = document.createElement("span");
					rankEl.className = "lb-rank";
					rankEl.textContent = MEDALS[rank] || String(rank);
					row.appendChild(rankEl);

					var wrap = document.createElement("div");
					wrap.className = "avatar-wrap";

					if (!isPlaceholder) {
						if (item.avatar) {
							var img = document.createElement("img");
							img.className = "lb-avatar";
							img.alt = "";
							img.onerror = function () {
								if (img.parentNode)
									img.parentNode.replaceChild(initialsEl(name), img);
							};
							img.src = item.avatar;
							wrap.appendChild(img);
						} else {
							wrap.appendChild(initialsEl(name));
						}
						if (rank === 1) wrap.appendChild(crownSvg());
					} else {
						wrap.appendChild(initialsEl(name));
					}
					row.appendChild(wrap);

					var info = document.createElement("div");
					info.className = "lb-info";

					var nameEl = document.createElement("span");
					nameEl.className = "lb-name";
					nameEl.textContent = name;
					info.appendChild(nameEl);

					var likesEl = document.createElement("span");
					likesEl.className = "lb-coins";
					likesEl.innerHTML = isPlaceholder
						? "—"
						: fmtLikes(likes) + " " + HEART_SVG;
					info.appendChild(likesEl);

					row.appendChild(info);
					return row;
				}

				function renderPlaceholders() {
					prev = {};
					rowsEl.textContent = "";
					for (var i = 1; i <= TOP_N; i++)
						rowsEl.appendChild(buildRow(i, null, true));
				}

				function render(data, uColor) {
					if (uColor) stageEl.style.setProperty("--username-color", uColor);

					if (!data || !data.length) {
						renderPlaceholders();
						return;
					}

					var frag = document.createDocumentFragment();
					var realCount = Math.min(data.length, TOP_N);

					data.slice(0, TOP_N).forEach(function (item, i) {
						frag.appendChild(buildRow(Number(item.rank) || i + 1, item, false));
					});

					for (var j = realCount + 1; j <= TOP_N; j++)
						frag.appendChild(buildRow(j, null, true));

					rowsEl.textContent = "";
					rowsEl.appendChild(frag);
					prev = {};
				}

				function scheduleReconnect() {
					var delay = Math.min(1000 * Math.pow(2, retry), 10000);
					retry++;
					setTimeout(connect, delay);
				}

				function connect() {
					try {
						ws = new WebSocket(WS_URL);
					} catch (err) {
						console.error("WebSocket init failed:", err);
						scheduleReconnect();
						return;
					}

					ws.onopen = function () {
						retry = 0;
						ws.send(JSON.stringify({ type: "identify", overlay: "top_like" }));
					};

					ws.onmessage = function (e) {
						try {
							var d = JSON.parse(e.data);
							if (d.type === "top_like")
								render(d.leaderboard, d.username_color);
						} catch (err) {
							console.error("Invalid WebSocket data:", err);
						}
					};

					ws.onerror = function () {
						try {
							ws.close();
						} catch (err) {
							/* ignore */
						}
					};

					ws.onclose = scheduleReconnect;
				}

				// --- boot ---
				renderPlaceholders();
				connect();
			})();
		</script>
	</body>
</html>
