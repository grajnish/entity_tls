<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Righteous&display=swap"
			rel="stylesheet"
		/>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
				font-family: "Righteous", sans-serif;
				font-weight: bolder;
				font-style: normal;
				-webkit-font-smoothing: antialiased;
			}

			#stage {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 8px;
				--title-color: rgba(255, 200, 60, 0.95);
				--username-color: #ffd700;
			}

			#tag {
				position: absolute;
				top: 4%;
				left: 0;
				right: 0;
				text-align: center;
				font-size: clamp(28px, 9vw, 96px);
				font-weight: 900;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--title-color);
				text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
			}

			#gift-wrap {
				flex: 1;
				min-height: 0;
				width: 100%;
				position: relative;
			}

			#gift-img {
				width: 100%;
				height: 100%;
				object-fit: contain;
				display: block;
				padding: 4px;
				filter: drop-shadow(0 10px 36px rgba(255, 180, 30, 0.75));
				animation: upDown 4s ease-in-out infinite;
			}

			#gift-init {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: contain;
				padding: 4px;
				filter: drop-shadow(0 10px 36px rgba(255, 180, 30, 0.75));
				animation: upDown 4s ease-in-out infinite;
			}

			#text-overlay {
				position: absolute;
				bottom: 4%;
				left: 0;
				right: 0;
				text-align: center;
				padding: 0 8px;
				z-index: 2;
			}

			#username {
				font-size: clamp(28px, 9vw, 96px);
				font-weight: 800;
				color: var(--username-color);
				text-shadow:
					0 0 10px #ffd700,
					0 0 20px #ffa500,
					0 0 30px #ff8c00;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				position: relative;
			}

			#username::before {
				content: attr(data-text);
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				animation: glitch 2s infinite;
				clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
				transform: translate(-2px, -2px);
				color: var(--username-color);
				text-shadow:
					0 0 5px #ffd700,
					0 0 15px #ffa500;
			}

			#amount {
				font-size: clamp(28px, 9vw, 96px);
				font-weight: 900;
				color: #ffbb00;
				line-height: 1;
				text-shadow:
					0 0 36px rgba(255, 190, 50, 0.7),
					0 4px 28px rgba(0, 0, 0, 0.55);
			}

			#badge {
				flex: 0 0 auto;
				display: inline-block;
				font-size: clamp(11px, 2.8vh, 18px);
				font-weight: 800;
				letter-spacing: 2px;
				text-transform: uppercase;
				color: #fff;
				background: linear-gradient(90deg, #f0932b, #e55b00);
				padding: clamp(4px, 1vh, 9px) clamp(14px, 3.5vw, 28px);
				border-radius: 20px;
				margin-top: 1.2vh;
				opacity: 0;
				transform: translateY(10px);
				transition:
					opacity 0.3s ease,
					transform 0.3s ease;
			}

			#badge.show {
				opacity: 1;
				transform: translateY(0);
			}

			@keyframes glitch {
				0%,
				100% {
					clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
					transform: translate(0);
				}
				33% {
					clip-path: polygon(0 0, 100% 0, 100% 15%, 0 15%);
					transform: translate(-5px, -5px);
				}
				66% {
					clip-path: polygon(0 85%, 100% 85%, 100% 100%, 0 100%);
					transform: translate(5px, 5px);
				}
			}

			@keyframes upDown {
				0%,
				100% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(10px);
				}
			}
		</style>
	</head>

	<body>
		<div id="stage">
			<div id="gift-wrap">
				<img
					id="gift-img"
					src=""
					style="display: none"
					onerror="
						this.style.display = 'none';
						document.getElementById('gift-init').style.display = 'block';
					"
				/>
				<img id="gift-init" src="https://img.icons8.com/fluency/200/gift.png" />
				<div id="tag">TOP GIFT</div>
				<div id="text-overlay">
					<div id="username">———</div>
					<div id="amount">— 💎</div>
				</div>
			</div>
			<span id="badge">⚡ NEW RECORD</span>
		</div>

		<script>
			let ws;

			const stageEl = document.getElementById("stage");
			const tagEl = document.getElementById("tag");
			const usernameEl = document.getElementById("username");
			const amountEl = document.getElementById("amount");
			const giftImg = document.getElementById("gift-img");
			const giftInit = document.getElementById("gift-init");
			const badgeEl = document.getElementById("badge");

			let _badgeTimer = null;

			function esc(s) {
				return String(s)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/"/g, "&quot;")
					.replace(/'/g, "&#039;");
			}

			const isUrl = (s) => typeof s === "string" && s.startsWith("http");

			function renderPlaceholder() {
				usernameEl.textContent = "———";
				usernameEl.setAttribute("data-text", "———");
				amountEl.textContent = "— 💎";
				giftImg.style.display = "none";
				giftInit.style.display = "block";
			}

			function render(data) {
				if (data && data.title) tagEl.textContent = "" + data.title;
				if (data && data.title_color)
					stageEl.style.setProperty("--title-color", data.title_color);
				if (data && data.username_color)
					stageEl.style.setProperty("--username-color", data.username_color);

				if (!data || !data.username || !data.coins) {
					renderPlaceholder();
					return;
				}

				if (isUrl(data.gift_icon)) {
					giftImg.src = data.gift_icon;
					giftImg.style.display = "block";
					giftInit.style.display = "none";
				} else {
					giftImg.style.display = "none";
					giftInit.style.display = "block";
				}

				usernameEl.textContent = data.username;
				usernameEl.setAttribute("data-text", data.username);
				amountEl.textContent =
					String(data.coins).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " 💎";

				if (data.live) {
					if (_badgeTimer) clearTimeout(_badgeTimer);
					badgeEl.classList.add("show");
					_badgeTimer = setTimeout(function () {
						badgeEl.classList.remove("show");
					}, 5000);
				}
			}

			function connect() {
				try {
					ws = new WebSocket("ws://127.0.0.1:8766");

					ws.onopen = function () {
						ws.send(JSON.stringify({ type: "identify", overlay: "top_gift" }));
					};

					ws.onmessage = function (e) {
						try {
							const d = JSON.parse(e.data);
							if (d.type === "top_gift") render(d);
						} catch (err) {
							console.error("Invalid WebSocket data:", err);
						}
					};

					ws.onclose = function () {
						setTimeout(connect, 1000);
					};

					ws.onerror = function () {
						try {
							ws.close();
						} catch (e) {}
					};
				} catch (err) {
					setTimeout(connect, 1000);
				}
			}

			renderPlaceholder();
			connect();
		</script>
	</body>
</html>
